<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 Rắn Săn Mồi</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:#fff; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:16px; touch-action:none;
  }
  h1 { font-size:26px; margin-bottom:4px; }
  .sub { color:#9fd8c9; font-size:13px; margin-bottom:12px; }
  #hud { display:flex; gap:18px; margin-bottom:10px; font-size:16px; }
  #hud b { color:#ffd54f; }
  #wrap { position:relative; }
  canvas {
    background:#0b1e25; border:3px solid #2e7d5b; border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.5); display:block; max-width:92vw;
  }
  #overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px;
    background:rgba(5,15,20,.78); border-radius:12px; text-align:center; padding:20px;
  }
  #overlay.hidden { display:none; }
  #overlay h2 { font-size:22px; }
  #overlay p { color:#bcd; font-size:14px; line-height:1.6; }
  button {
    background:#2e9e63; color:#fff; border:none; border-radius:8px;
    padding:12px 28px; font-size:16px; font-weight:700; cursor:pointer;
  }
  button:hover { background:#35b574; }
  .hint { margin-top:10px; font-size:12px; color:#7fa8a0; text-align:center; line-height:1.7; }
</style>
</head>
<body>
  <h1>🐍 Rắn Săn Mồi</h1>
  <div class="sub">Bản demo đẩy lên GitHub Pages</div>
  <div id="hud"><div>Điểm: <b id="score">0</b></div><div>Kỷ lục: <b id="best">0</b></div></div>
  <div id="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="ovTitle">Sẵn sàng chưa?</h2>
      <p id="ovText">Dùng phím mũi tên hoặc vuốt màn hình để điều khiển.<br>Ăn mồi để lớn lên, đừng cắn chính mình!</p>
      <button id="btnStart">▶ Bắt đầu</button>
    </div>
  </div>
  <div class="hint">⌨️ Phím mũi tên / WASD &nbsp;•&nbsp; 📱 Vuốt trên màn hình cảm ứng</div>
<script>
"use strict";
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const N = 20, CELL = cv.width / N;
let snake, dir, nextDir, food, score, best = +(localStorage.getItem('ran_best') || 0), timer = null, speed = 130;
document.getElementById('best').textContent = best;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = nextDir = {x:1,y:0};
  score = 0; speed = 130;
  document.getElementById('score').textContent = 0;
  placeFood();
}
function placeFood() {
  while (true) {
    const f = {x: (Math.random()*N)|0, y: (Math.random()*N)|0};
    if (!snake.some(s => s.x===f.x && s.y===f.y)) { food = f; return; }
  }
}
function draw() {
  ctx.fillStyle = '#0b1e25'; ctx.fillRect(0,0,cv.width,cv.height);
  // food
  ctx.fillStyle = '#ff5252';
  ctx.beginPath();
  ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL/2-2, 0, 7);
  ctx.fill();
  // snake
  snake.forEach((s,i) => {
    ctx.fillStyle = i===0 ? '#66bb6a' : '#43a047';
    const p = 1;
    ctx.fillRect(s.x*CELL+p, s.y*CELL+p, CELL-p*2, CELL-p*2);
    if (i===0) {
      ctx.fillStyle = '#123';
      const cx = s.x*CELL+CELL/2, cy = s.y*CELL+CELL/2;
      const ex = dir.x*4, ey = dir.y*4;
      ctx.beginPath(); ctx.arc(cx-5+ex, cy-4+ey, 2.2, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+5+ex, cy-4+ey, 2.2, 0, 7); ctx.fill();
    }
  });
}
function step() {
  dir = nextDir;
  const h = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (h.x<0||h.y<0||h.x>=N||h.y>=N || snake.some(s=>s.x===h.x&&s.y===h.y)) return gameOver();
  snake.unshift(h);
  if (h.x===food.x && h.y===food.y) {
    score += 10;
    document.getElementById('score').textContent = score;
    if (score > best) { best = score; localStorage.setItem('ran_best', best); document.getElementById('best').textContent = best; }
    if (speed > 70) { speed -= 4; restartTimer(); }
    placeFood();
  } else snake.pop();
  draw();
}
function restartTimer(){ clearInterval(timer); timer = setInterval(step, speed); }
function start() {
  document.getElementById('overlay').classList.add('hidden');
  reset(); draw(); restartTimer();
}
function gameOver() {
  clearInterval(timer);
  document.getElementById('ovTitle').textContent = '💀 Thua rồi!';
  document.getElementById('ovText').innerHTML = `Điểm của bạn: <b style="color:#ffd54f">${score}</b><br>Kỷ lục: <b style="color:#ffd54f">${best}</b>`;
  document.getElementById('btnStart').textContent = '↺ Chơi lại';
  document.getElementById('overlay').classList.remove('hidden');
}
const KEYS = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
document.addEventListener('keydown', e => {
  const k = KEYS[e.key]; if (!k) return;
  e.preventDefault();
  if (k[0] !== -dir.x || k[1] !== -dir.y) nextDir = {x:k[0], y:k[1]};
});
let tx=0, ty=0;
cv.addEventListener('touchstart', e => { const t=e.changedTouches[0]; tx=t.clientX; ty=t.clientY; }, {passive:true});
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  const t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty;
  if (Math.abs(dx)<18 && Math.abs(dy)<18) return;
  const nd = Math.abs(dx)>Math.abs(dy) ? {x:Math.sign(dx),y:0} : {x:0,y:Math.sign(dy)};
  if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
  tx=t.clientX; ty=t.clientY;
}, {passive:false});
document.getElementById('btnStart').addEventListener('click', start);
reset(); draw();
</script>
</body>
</html>
